<head>

<title>Quiz Results Are Private</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#020817;color:#e2e8f0;font-family:Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem;}
.card{max-width:460px;text-align:center;background:#111827;border:1px solid #1e2d45;border-radius:14px;padding:2.25rem 1.75rem;}
.icon{font-size:2.5rem;margin-bottom:0.75rem;}
h1{font-size:1.25rem;margin-bottom:0.75rem;color:#10b981;}
p{color:#94a3b8;font-size:0.92rem;line-height:1.7;margin-bottom:1.25rem;}
a{display:inline-block;padding:0.65rem 1.5rem;background:rgba(0,229,255,0.1);color:#00e5ff;border:1px solid rgba(0,229,255,0.3);border-radius:8px;text-decoration:none;font-weight:700;font-size:0.9rem;}
</style>
</head>
<body>
<div class="card">
  <div class="icon">&#128274;</div>
  <h1>Quiz results are private</h1>
  <p>There is no public class leaderboard. Each student&rsquo;s quiz results are shown only to that student and the instructor, so everyone can take the quizzes without worrying about how they compare with others.</p>

</div>
